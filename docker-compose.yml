services:
  postgres:
    image: postgres:17-alpine
    container_name: rezora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rezora
      POSTGRES_USER: rezora
      POSTGRES_PASSWORD: promijeni-lozinku
      TZ: Europe/Sarajevo
    ports:
      - "5432:5432"
    volumes:
      - rezora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezora -d rezora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rezora_postgres_data:

