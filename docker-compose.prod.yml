# Produkcijsko pokretanje na serveru.
#
# Razlike u odnosu na razvojni docker-compose.yml:
#   - baza NIJE otvorena prema internetu, dostupna je samo aplikaciji;
#   - lozinke i tajne dolaze iz .env, ništa nije upisano u ovaj fajl;
#   - Caddy sam pribavlja i obnavlja HTTPS certifikat;
#   - sve se samo diže nakon pada ili restarta servera.
#
# Pokretanje:  docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    container_name: rezora-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rezora}
      POSTGRES_USER: ${POSTGRES_USER:-rezora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mora biti postavljen u .env}
      TZ: Europe/Sarajevo
    # Namjerno bez "ports": baza je dostupna samo unutar Docker mreže.
    volumes:
      - rezora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rezora} -d ${POSTGRES_DB:-rezora}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rezora]

  app:
    build: .
    container_name: rezora-app
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-rezora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rezora}
      TZ: Europe/Sarajevo
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rezora]

  # Tok razgovora koji vlasnik crta sam.
  #
  # Gateway i dalje prima Metin webhook (potpis, ponovljene isporuke, kojem
  # klijentu poruka pripada) i dalje SAM salje odgovor na WhatsApp — n8n samo
  # vrati tekst. Tako Metini kljucevi nikad ne izlaze iz gatewaya, a tok se
  # moze mijenjati bez isporuke koda.
  #
  # Rezervacije NE upisuje n8n nego Coreov interni API: provjera slobodnog
  # termina i upis moraju biti jedan potez, inace dvije poruke u istoj sekundi
  # dobiju isti termin.
  n8n:
    image: n8nio/n8n:latest
    container_name: rezora-n8n
    restart: always
    environment:
      N8N_HOST: ${N8N_DOMENA:?N8N_DOMENA mora biti postavljena u .env, npr. n8n.rezora.xyz}
      WEBHOOK_URL: https://${N8N_DOMENA}/
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      # Caddy je jedini put izvana; n8n vidi samo njegov proxy.
      N8N_PROXY_HOPS: 1
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_KORISNIK:-rezora}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_LOZINKA:?N8N_LOZINKA mora biti postavljena u .env}
      # Bez ovoga n8n cuva tokove u SQLite datoteci u kontejneru.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_BAZA:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-rezora}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY mora biti postavljen u .env}
      GENERIC_TIMEZONE: Europe/Sarajevo
      TZ: Europe/Sarajevo
      N8N_DIAGNOSTICS_ENABLED: 'false'
      # Tok zove gateway istim internim kljucem kao i sve ostalo. Bez ovog
      # dopustenja n8n cvorovima ne da da procitaju vlastito okruzenje, pa bi
      # kljuc morao biti otkucan u sam tok — a tok se izvozi i dijeli.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY mora biti postavljen u .env}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rezora]

  caddy:
    image: caddy:2-alpine
    container_name: rezora-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMENA: ${DOMENA:?DOMENA mora biti postavljena u .env, npr. api.rezora.xyz}
      N8N_DOMENA: ${N8N_DOMENA:?N8N_DOMENA mora biti postavljena u .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, n8n]
    networks: [rezora]

  # Docker sam vraća kontejner koji se ugasi, ali ne i onaj koji se zaglavi —
  # proces radi, a health provjera pada. Ovo hvata baš takav slučaj.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: rezora-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  rezora_postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  rezora:
    # Supabase objavljuje direktnu adresu baze SAMO preko IPv6. Bez ovoga
    # kontejner razriješi ime, ali do njega ne može doći.
    enable_ipv6: true
